<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">殴られて</title>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- A foreshortened wrist behind the fist. -->
    <path d="M31 63 L65 63 L67 86 L29 86 Z" fill="#C49A7F" stroke="#E8E0E5" stroke-width="2.5"/>
    <!-- Four knuckles face the viewer, rather than showing the side of a hand. -->
    <path d="M13 38 L13 32 C13 20 26 18 31 25
             C32 13 47 12 50 23 C54 13 68 17 68 27
             C74 20 84 27 84 36 L84 51
             Q84 65 72 72 L60 77 L34 75 Q18 70 15 56 Z"
          fill="#D6AF93" stroke="#E8E0E5" stroke-width="2.5"/>
    <!-- Curled fingers: rounded front pads and separated finger joints. -->
    <path d="M31 26 L31 46 Q31 54 23 54 Q16 54 15 49
             M50 24 L50 46 Q50 55 41 55 Q32 55 31 48
             M68 28 L68 47 Q68 56 59 56 Q51 56 50 48
             M82 48 Q81 56 75 56 Q69 56 68 49"
          fill="none" stroke="#8F6E5F" stroke-width="2"/>
    <!-- Thumb wraps across the underside of the curled fingers. -->
    <path d="M78 57 Q70 54 63 58 L44 61
             C35 62 35 71 43 74 L59 78 Q73 78 79 69"
          fill="#D6AF93" stroke="#8F6E5F" stroke-width="2"/>
    <path d="M42 64 Q47 62 51 64 L51 70 Q46 72 42 69 Z"
          fill="#E6C4A8" stroke="#AA846C" stroke-width="1.2"/>
    <path d="M20 35 L25 34 M37 29 L43 29 M56 31 L62 31 M73 36 L77 37"
          fill="none" stroke="#EDCDB2" stroke-width="2.5"/>
    <path d="M35 80 L59 81" fill="none" stroke="#A87E65" stroke-width="1.5"/>
    <path d="M7 18 L12 23 M48 5 L48 10 M86 18 L90 14"
          fill="none" stroke="#D9C591" stroke-width="3"/>
  </g>
</svg>
